ough to bring the gap under tenfold</title><rect x="1274" y="136" width="196" height="58" rx="6"/><text x="1283" y="152"><tspan class="nid">a1 ATTACK HOLE</tspan></text><text x="1283" y="168">A commercially available</text><text x="1283" y="183">seeder exists that p...</text></g><g class="node n-attack n-live"><title>FarmBot&#x27;s maker publishes an ROI analysis showing the robot pays for itself</title><rect x="1484" y="136" width="196" height="58" rx="6"/><text x="1493" y="152"><tspan class="nid">a2 ATTACK</tspan></text><text x="1493" y="168">FarmBot&#x27;s maker publishes</text><text x="1493" y="183">an ROI analysis show...</text></g><g class="schip live"><title>FarmBot Genesis XL v1.8 product page [LIVE]</title><rect x="95" y="256" width="52" height="24" rx="12"/><text x="121" y="272" text-anchor="middle">s1</text></g><g class="schip walled"><title>BLS OES 45-2092 Farmworkers and Laborers, Crop (current) [WALLED]</title><rect x="337" y="256" width="52" height="24" rx="12"/><text x="363" y="272" text-anchor="middle">s2</text></g><g class="schip live"><title>O*NET OnLine 45-2092.00 summary (republishes BLS wage data) [LIVE]</title><rect x="579" y="256" width="52" height="24" rx="12"/><text x="605" y="272" text-anchor="middle">s3</text></g><g class="schip live"><title>Paperpot Co, Jang JP5 seeder product page [LIVE]</title><rect x="821" y="256" width="52" height="24" rx="12"/><text x="847" y="272" text-anchor="middle">s4</text></g><g class="schip live"><title>FarmDroid FD20 product page [LIVE]</title><rect x="1063" y="256" width="52" height="24" rx="12"/><text x="1089" y="272" text-anchor="middle">s5</text></g><g class="schip live"><title>Robotomated FD20 review page [LIVE]</title><rect x="1305" y="256" width="52" height="24" rx="12"/><text x="1331" y="272" text-anchor="middle">s6</text></g><g class="schip live"><title>FarmBot official ROI page [LIVE]</title><rect x="1547" y="256" width="52" height="24" rx="12"/><text x="1573" y="272" text-anchor="middle">s7</text>